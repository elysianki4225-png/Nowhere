name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          bash --version | head -n1
          echo "runner: $(uname -srm)"

      - name: Syntax check
        run: |
          bash -n nw.sh
          bash -n install.sh
          bash -n tests/run.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version
          # severity=warning: style-level notes are advisory only
          shellcheck -S warning nw.sh install.sh tests/run.sh

      - name: Unit + e2e tests (mock binary, no root, no network)
        run: bash tests/run.sh

      - name: CLI smoke
        run: |
          bash nw.sh help | head -n1
          bash nw.sh version
